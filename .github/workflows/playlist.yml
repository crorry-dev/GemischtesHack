name: Sync Spotify playlist

# Bestätigte Songs aus data/zitate.csv in die Playlist übernehmen (Link in scripts/playlist.py).
# Einrichtung und Secrets: siehe scripts/playlist.py. Ohne Spotify-Zugang passiert nichts.

on:
  push:
    branches:
      - main
  # einmal am Tag: korrigiert Umsortierungen von Hand und meldet eine abgelaufene Anmeldung
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: playlist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Sync confirmed songs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/playlist.py
