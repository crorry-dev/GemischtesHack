name: Weekly community update

on:
  schedule:
    # Donnerstag, 06:17 UTC (07:17 MEZ / 08:17 MESZ)
    - cron: "17 6 * * 4"
  workflow_dispatch:
    inputs:
      alle:
        description: "Alle offenen Formularvorschläge freigeben (sonst nur /approve)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: community-update
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      discussions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check batch processing and statistics
        run: |
          python3 -m unittest discover -s tests -q
          node --test tests/statistics.test.mjs
      - name: List all open suggestions
        run: python3 scripts/discussions.py --comments > "$RUNNER_TEMP/offen.json"
      - name: Apply approved suggestions in one commit
        env:
          APPROVE_ALL: ${{ inputs.alle || false }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          args=()
          if [ "$APPROVE_ALL" = "true" ]; then args+=(--alle); fi
          python3 scripts/sammellauf.py --discussions --commit --offen "$RUNNER_TEMP/offen.json" "${args[@]}"

  playlist:
    needs: apply
    uses: ./.github/workflows/playlist.yml
    secrets: inherit

  # Einmal veröffentlichen, auch wenn nur der Stand offener Vorschläge neu ist.
  pages:
    needs: [apply, playlist]
    if: ${{ !cancelled() && needs.apply.result == 'success' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      issues: read
      discussions: read
      pages: write
      id-token: write
