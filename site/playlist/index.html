<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Die Playlist mit den Songs hinter Felix' Einstiegszitaten aus Gemischtes Hack.">
    <meta name="theme-color" content="#f1e9da">
    <title>Playlist — Gemischtes Hack</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238b5a2b'/%3E%3Ctext x='16' y='21' font-family='system-ui,sans-serif' font-size='13' font-weight='800' text-anchor='middle' fill='%23fff'%3EGH%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/site.css">
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        // ohne Speicher gilt die Systemeinstellung
      }
    </script>
    <script type="module">
      import { loadPlaylist } from "../assets/data.js";

      // Feste Adresse für README und Links nach außen, leitet zur Playlist aus scripts/playlist.py weiter
      const url = await loadPlaylist(["../data/", "../../data/"]);
      const status = document.querySelector("#status");
      if (url) {
        status.textContent = "Weiter zu Spotify …";
        const open = document.querySelector("#open");
        open.href = url;
        open.hidden = false;
        location.replace(url);
      } else {
        status.textContent = "Die Playlist ist noch nicht online. Sobald es losgeht, führt dieser Link direkt zu Spotify.";
      }
    </script>
  </head>
  <body class="redirect">
    <main class="redirect-card">
      <span class="logo-mark" aria-hidden="true">GH</span>
      <h1>Die Playlist</h1>
      <p>Die Songs hinter Felix' Einstiegszitaten aus Gemischtes Hack, gesammelt von der Community.</p>
      <p id="status" role="status">Einen Moment …</p>
      <a class="button" id="open" hidden>Auf Spotify öffnen</a>
      <a class="button button-quiet" href="../">Zur Sammlung</a>
    </main>
  </body>
</html>
